[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-sorter"
version = "0.1.0"
description = "Offline AI-assisted image collection management system"
requires-python = ">=3.11,<3.14"
dependencies = [
    "PySide6>=6.7,<7",
]

[project.scripts]
ai-sorter = "ai_sorter.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
